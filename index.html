<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JJSMeshConverter</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #090909;
    color: #fff;
    font-family: Arial, sans-serif;
}

header {
    padding: 25px;
    text-align: center;
    border-bottom: 1px solid #222;
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header p {
    color: #888;
    margin-bottom: 0;
}

.container {
    width: min(1200px, 94%);
    margin: 25px auto;
}

.card {
    background: #111;
    border: 1px solid #242424;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
}

textarea {
    width: 100%;
    min-height: 350px;
    resize: vertical;
    background: #080808;
    color: #ddd;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 15px;
    font-family: Consolas, monospace;
    font-size: 13px;
    outline: none;
}

textarea:focus {
    border-color: #666;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 12px 18px;
    margin: 8px 5px 0 0;
    background: #fff;
    color: #000;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: .85;
}

button.secondary {
    background: #222;
    color: #fff;
}

.status {
    margin-top: 12px;
    color: #888;
}

.output {
    min-height: 250px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 15px;
}

.stat {
    background: #0b0b0b;
    border: 1px solid #222;
    border-radius: 8px;
    padding: 15px;
}

.stat b {
    display: block;
    font-size: 22px;
}

.stat span {
    color: #777;
    font-size: 12px;
}

@media(max-width:700px) {
    .stats {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<header>
    <h1>JJSMeshConverter</h1>
    <p>Avatar JSON → JJS → Zstandard → Base64</p>
</header>

<div class="container">

    <div class="card">
        <h2>Avatar JSON</h2>

        <textarea
            id="input"
            placeholder="Paste the JSON exported by your Roblox avatar exporter here..."
        ></textarea>

        <br>

        <button onclick="convert()">
            Convert
        </button>

        <button class="secondary" onclick="loadFile()">
            Load JSON File
        </button>

        <button class="secondary" onclick="clearAll()">
            Clear
        </button>

        <input
            id="fileInput"
            type="file"
            accept=".json,application/json"
            hidden
        >

        <div class="status" id="status">
            Waiting for JSON...
        </div>
    </div>


    <div class="card">
        <h2>JJS Payload</h2>

        <textarea
            id="jjsOutput"
            class="output"
            readonly
            placeholder="JJS JSON will appear here..."
        ></textarea>

        <button onclick="copyJJS()">
            Copy JJS JSON
        </button>
    </div>


    <div class="card">
        <h2>Zstandard → Base64</h2>

        <textarea
            id="base64Output"
            class="output"
            readonly
            placeholder="Your final JJS Base64 code will appear here..."
        ></textarea>

        <button onclick="copyBase64()">
            Copy Base64
        </button>

        <button class="secondary" onclick="downloadBase64()">
            Download
        </button>
    </div>


    <div class="card">
        <h2>Export Information</h2>

        <div class="stats">
            <div class="stat">
                <b id="meshCount">0</b>
                <span>Meshes</span>
            </div>

            <div class="stat">
                <b id="textureCount">0</b>
                <span>Textures</span>
            </div>

            <div class="stat">
                <b id="clothingCount">0</b>
                <span>Clothing</span>
            </div>

            <div class="stat">
                <b id="accessoryCount">0</b>
                <span>Accessories</span>
            </div>
        </div>
    </div>

</div>


<!--
    zstd-codec provides real Zstandard compression in the browser.
-->
<script src="https://cdn.jsdelivr.net/npm/zstd-codec@0.1.5/dist/zstd-codec.js"></script>

<script>

let lastBase64 = "";


/* ============================================================
   File loading
============================================================ */

function loadFile() {

    document.getElementById("fileInput").click();

}

document.getElementById("fileInput").addEventListener("change", function(e) {

    const file = e.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function() {

        document.getElementById("input").value = reader.result;

        setStatus("JSON loaded.");

    };

    reader.readAsText(file);

});


/* ============================================================
   Utility
============================================================ */

function setStatus(text) {

    document.getElementById("status").textContent = text;

}


function copyText(text) {

    navigator.clipboard.writeText(text);

}


function copyJJS() {

    const text = document.getElementById("jjsOutput").value;

    if (!text) return;

    copyText(text);

    setStatus("JJS JSON copied.");

}


function copyBase64() {

    if (!lastBase64) return;

    copyText(lastBase64);

    setStatus("Base64 copied.");

}


function clearAll() {

    document.getElementById("input").value = "";
    document.getElementById("jjsOutput").value = "";
    document.getElementById("base64Output").value = "";

    lastBase64 = "";

    document.getElementById("meshCount").textContent = "0";
    document.getElementById("textureCount").textContent = "0";
    document.getElementById("clothingCount").textContent = "0";
    document.getElementById("accessoryCount").textContent = "0";

    setStatus("Cleared.");

}


/* ============================================================
   Extract asset IDs
============================================================ */

function collectAssets(data) {

    const meshes = [];
    const textures = [];
    const clothing = [];
    const accessories = [];


    function addMesh(mesh) {

        if (!mesh) return;

        const props = mesh.Properties || {};

        if (props.MeshId) {

            meshes.push({
                name: mesh.Name || "",
                className: mesh.ClassName || "",
                meshId: props.MeshId
            });

        }

        const texture =
            props.TextureID ||
            props.TextureId ||
            props.Texture;

        if (texture) {

            textures.push({
                name: mesh.Name || "",
                textureId: texture
            });

        }

    }


    function scanObject(obj) {

        if (!obj || typeof obj !== "object") return;


        if (Array.isArray(obj)) {

            for (const item of obj) {

                scanObject(item);

            }

            return;

        }


        if (obj.Meshes) {

            for (const mesh of obj.Meshes) {

                addMesh(mesh);

            }

        }


        if (obj.Clothing) {

            for (const item of obj.Clothing) {

                const props = item.Properties || {};

                clothing.push({
                    name: item.Name || "",
                    className: item.ClassName || "",
                    shirt: props.ShirtTemplate || null,
                    pants: props.PantsTemplate || null,
                    graphic: props.Graphic || null
                });

            }

        }


        if (obj.Accessories) {

            for (const item of obj.Accessories) {

                accessories.push({
                    name: item.Name || "",
                    className: item.ClassName || ""
                });

            }

        }


        if (obj.Parts) {

            for (const part of obj.Parts) {

                const props = part.Properties || {};

                const meshId = props.MeshId;

                const texture =
                    props.TextureID ||
                    props.TextureId ||
                    props.Texture;

                if (meshId) {

                    meshes.push({
                        name: part.Name || "",
                        className: part.ClassName || "",
                        meshId: meshId
                    });

                }

                if (texture) {

                    textures.push({
                        name: part.Name || "",
                        textureId: texture
                    });

                }

            }

        }

    }


    scanObject(data);


    return {
        meshes,
        textures,
        clothing,
        accessories
    };

}


/* ============================================================
   Build JJS payload
============================================================ */

function buildJJSPayload(avatar) {

    const assets = collectAssets(avatar);


    /*
        This is the normalized payload sent into the
        Zstandard stage.

        The complete original avatar data is retained under
        "Avatar" so no information from the Roblox exporter
        gets thrown away.
    */

    const jjs = {

        Version: 1,

        Type: "Avatar",

        Meshes: assets.meshes,

        Textures: assets.textures,

        Clothing: assets.clothing,

        Accessories: assets.accessories,

        Avatar: avatar

    };


    return jjs;

}


/* ============================================================
   Zstandard compression
============================================================ */

function compressZstd(text) {

    return new Promise((resolve, reject) => {

        try {

            if (
                typeof ZstdCodec === "undefined"
            ) {

                reject(
                    new Error(
                        "Zstandard library failed to load."
                    )
                );

                return;

            }


            ZstdCodec.run(function(zstd) {

                try {

                    const simple = new zstd.Simple();

                    const encoder = new TextEncoder();

                    const inputBytes =
                        encoder.encode(text);


                    /*
                        Compression level 10.
                        Change this if your JJS format
                        requires another level.
                    */

                    const compressed =
                        simple.compress(
                            inputBytes,
                            10
                        );


                    resolve(compressed);

                } catch(error) {

                    reject(error);

                }

            });

        } catch(error) {

            reject(error);

        }

    });

}


/* ============================================================
   Uint8Array → Base64
============================================================ */

function uint8ToBase64(bytes) {

    let binary = "";

    const chunkSize = 0x8000;

    for (
        let i = 0;
        i < bytes.length;
        i += chunkSize
    ) {

        const chunk =
            bytes.subarray(
                i,
                Math.min(
                    i + chunkSize,
                    bytes.length
                )
            );

        binary += String.fromCharCode(...chunk);

    }

    return btoa(binary);

}


/* ============================================================
   Main conversion
============================================================ */

async function convert() {

    const input =
        document.getElementById("input").value.trim();


    if (!input) {

        setStatus("Paste your avatar JSON first.");

        return;

    }


    let avatar;


    try {

        avatar = JSON.parse(input);

    } catch(error) {

        setStatus(
            "Invalid JSON: " + error.message
        );

        return;

    }


    setStatus("Reading avatar data...");


    try {

        const assets =
            collectAssets(avatar);


        document.getElementById(
            "meshCount"
        ).textContent =
            assets.meshes.length;


        document.getElementById(
            "textureCount"
        ).textContent =
            assets.textures.length;


        document.getElementById(
            "clothingCount"
        ).textContent =
            assets.clothing.length;


        document.getElementById(
            "accessoryCount"
        ).textContent =
            assets.accessories.length;


        const jjs =
            buildJJSPayload(avatar);


        const jjsString =
            JSON.stringify(jjs);


        document.getElementById(
            "jjsOutput"
        ).value =
            JSON.stringify(jjs, null, 2);


        setStatus(
            "Compressing with Zstandard..."
        );


        const compressed =
            await compressZstd(jjsString);


        const base64 =
            uint8ToBase64(compressed);


        lastBase64 = base64;


        document.getElementById(
            "base64Output"
        ).value =
            base64;


        setStatus(
            "Finished! JJS → Zstandard → Base64."
        );


    } catch(error) {

        console.error(error);

        setStatus(
            "Conversion failed: " +
            error.message
        );

    }

}


/* ============================================================
   Download Base64
============================================================ */

function downloadBase64() {

    if (!lastBase64) return;


    const blob =
        new Blob(
            [lastBase64],
            { type: "text/plain" }
        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");


    a.href = url;

    a.download =
        "jjs-avatar-base64.txt";


    a.click();


    URL.revokeObjectURL(url);

}

</script>

</body>
</html>
