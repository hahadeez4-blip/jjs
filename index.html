<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JJS Mesh Converter</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #101010;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    width: min(800px, 94%);
    margin: 40px auto;
}

.section {
    background: #1b1b1b;
    padding: 25px;
    margin-bottom: 25px;
    border-radius: 16px;
}

h1, h2 {
    text-align: center;
}

.mesh {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 10px;
    margin-top: 12px;
    align-items: center;
}

.headers {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 10px;
    color: #aaa;
    font-size: 13px;
}

input {
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 8px;
    background: #292929;
    color: white;
    font-size: 15px;
    outline: none;
}

textarea {
    width: 100%;
    min-height: 180px;
    margin-top: 15px;
    padding: 12px;
    resize: vertical;
    border: 0;
    border-radius: 8px;
    background: #080808;
    color: #00ff88;
    font-family: monospace;
    font-size: 13px;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 13px;
    border: 0;
    border-radius: 8px;
    background: #5865f2;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #4752c4;
}

.remove {
    width: 45px;
    margin: 0;
    padding: 11px;
    background: #d33;
}

.remove:hover {
    background: #a22;
}

#status,
#decodeStatus {
    margin-top: 15px;
    text-align: center;
    color: #aaa;
}
</style>
</head>

<body>

<div class="container">

    <!-- ========================= -->
    <!-- ENCODER -->
    <!-- ========================= -->

    <div class="section">

        <h1>JJS Mesh Encoder</h1>

        <div class="headers">
            <div>Mesh Texture ID</div>
            <div>Asset ID</div>
            <div></div>
        </div>

        <div id="meshes"></div>

        <button id="addButton">
            + Add Mesh
        </button>

        <button id="generateButton">
            Generate Single JJS Code
        </button>

        <textarea
            id="output"
            readonly
            placeholder="Zstandard Base64 code..."
        ></textarea>

        <button id="copyButton">
            Copy Code
        </button>

        <div id="status">
            Ready
        </div>

    </div>


    <!-- ========================= -->
    <!-- DECODER -->
    <!-- ========================= -->

    <div class="section">

        <h2>KLUv Decoder</h2>

        <textarea
            id="decodeInput"
            placeholder="Paste KLUv / Base64 code here..."
        ></textarea>

        <button id="decodeButton">
            Decode KLUv → JSON
        </button>

        <textarea
            id="decodeOutput"
            readonly
            placeholder="Decoded JSON will appear here..."
        ></textarea>

        <button id="copyDecodedButton">
            Copy JSON
        </button>

        <div id="decodeStatus">
            Ready
        </div>

    </div>

</div>


<script type="module">

import {
    compress,
    decompress
} from "https://esm.sh/@cloudpss/zstd@0.3.23";


/* =========================================
   ENCODER
========================================= */

const meshes =
    document.getElementById("meshes");

const addButton =
    document.getElementById("addButton");

const generateButton =
    document.getElementById("generateButton");

const copyButton =
    document.getElementById("copyButton");

const output =
    document.getElementById("output");

const status =
    document.getElementById("status");


/* Add mesh row */
function addMesh(texture = "", asset = "") {

    const row =
        document.createElement("div");

    row.className = "mesh";

    row.innerHTML = `
        <input
            class="texture"
            type="number"
            placeholder="Texture ID"
            value="${texture}"
        >

        <input
            class="asset"
            type="number"
            placeholder="Asset ID"
            value="${asset}"
        >

        <button class="remove">
            ×
        </button>
    `;


    row.querySelector(".remove")
        .addEventListener("click", () => {

            if (meshes.children.length > 1) {
                row.remove();
            }

        });


    meshes.appendChild(row);
}


/* Start with one row */
addMesh();


/* Add mesh */
addButton.addEventListener("click", () => {
    addMesh();
});


/* Uint8Array → Base64 */
function bytesToBase64(bytes) {

    let binary = "";

    const chunkSize = 0x8000;

    for (
        let i = 0;
        i < bytes.length;
        i += chunkSize
    ) {

        const chunk =
            bytes.subarray(
                i,
                Math.min(
                    i + chunkSize,
                    bytes.length
                )
            );

        binary +=
            String.fromCharCode(...chunk);
    }

    return btoa(binary);
}


/* Base64 → Uint8Array */
function base64ToBytes(base64) {

    /*
        Remove whitespace/newlines
    */
    base64 =
        base64
            .replace(/\s/g, "");

    const binary =
        atob(base64);

    const bytes =
        new Uint8Array(binary.length);

    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary.charCodeAt(i);
    }

    return bytes;
}


/* Generate combined code */
generateButton.addEventListener(
    "click",
    async () => {

        const rows =
            [
                ...meshes.querySelectorAll(".mesh")
            ];

        const lines = [];


        for (const row of rows) {

            const texture =
                row.querySelector(".texture")
                    .value.trim();

            const asset =
                row.querySelector(".asset")
                    .value.trim();


            if (!texture && !asset) {
                continue;
            }


            if (!texture || !asset) {

                alert(
                    "Every mesh needs both IDs."
                );

                return;
            }


            lines.push({

                TEXTURE:
                    Number(texture),

                AMOUNT:
                    Number(asset),

                K_NAME:
                    "VISUAL",

                EFFECT:
                    "Mesh"
            });
        }


        if (lines.length === 0) {

            alert(
                "Add at least one mesh."
            );

            return;
        }


        status.textContent =
            "Generating...";


        const innerData = {

            Line: lines,

            Prop: [],

            Req: []
        };


        const jjsData = [

            {
                ADD: false,

                NAME: "IMPORT",

                K_NAME: "SKILL",

                KEY: 1,

                "TOOL TIP": "",

                DATA:
                    JSON.stringify(innerData),

                COOLDOWN: 0
            }

        ];


        const json =
            JSON.stringify(jjsData);


        try {

            const encoder =
                new TextEncoder();

            const bytes =
                encoder.encode(json);


            const compressed =
                await compress(bytes, 3);


            const base64 =
                bytesToBase64(compressed);


            output.value =
                base64;


            status.textContent =
                `Done! ${lines.length} mesh${
                    lines.length === 1
                        ? ""
                        : "es"
                } combined.`;

        } catch (error) {

            console.error(error);

            status.textContent =
                "Conversion failed.";

            alert(
                error.message
            );
        }
    }
);


/* Copy encoded code */
copyButton.addEventListener(
    "click",
    async () => {

        if (!output.value) {

            alert(
                "Generate a code first."
            );

            return;
        }


        await navigator.clipboard.writeText(
            output.value
        );


        status.textContent =
            "Copied!";
    }
);


/* =========================================
   DECODER
========================================= */

const decodeInput =
    document.getElementById("decodeInput");

const decodeButton =
    document.getElementById("decodeButton");

const decodeOutput =
    document.getElementById("decodeOutput");

const decodeStatus =
    document.getElementById("decodeStatus");

const copyDecodedButton =
    document.getElementById("copyDecodedButton");


/*
    Decode:

    Base64
       ↓
    Zstandard
       ↓
    UTF-8
       ↓
    JSON
*/
decodeButton.addEventListener(
    "click",
    async () => {

        const input =
            decodeInput.value.trim();


        if (!input) {

            alert(
                "Paste a KLUv/Base64 code first."
            );

            return;
        }


        try {

            decodeStatus.textContent =
                "Decoding Base64...";


            /*
                Base64 → bytes
            */
            const compressed =
                base64ToBytes(input);


            decodeStatus.textContent =
                "Decompressing Zstandard...";


            /*
                Zstandard → original bytes
            */
            const decompressed =
                await decompress(
                    compressed
                );


            decodeStatus.textContent =
                "Converting to JSON...";


            /*
                Bytes → UTF-8 string
            */
            const decoder =
                new TextDecoder();


            const jsonText =
                decoder.decode(
                    decompressed
                );


            /*
                Verify it's valid JSON
            */
            const parsed =
                JSON.parse(jsonText);


            /*
                Pretty-print JSON
            */
            decodeOutput.value =
                JSON.stringify(
                    parsed,
                    null,
                    2
                );


            decodeStatus.textContent =
                "Decoded successfully!";

        } catch (error) {

            console.error(error);

            decodeStatus.textContent =
                "Could not decode code.";

            decodeOutput.value = "";

            alert(
                "Decode failed.\n\n" +
                "Make sure the code is Base64 containing standard Zstandard-compressed JSON.\n\n" +
                error.message
            );
        }
    }
);


/* Copy decoded JSON */
copyDecodedButton.addEventListener(
    "click",
    async () => {

        if (!decodeOutput.value) {

            alert(
                "Decode a code first."
            );

            return;
        }


        await navigator.clipboard.writeText(
            decodeOutput.value
        );


        decodeStatus.textContent =
            "JSON copied!";
    }
);

</script>

</body>
</html>
