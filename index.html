<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coverter</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #101010;
        color: white;
        font-family: Arial, sans-serif;
    }

    .container {
        width: min(700px, 92%);
        margin: 50px auto;
        padding: 25px;
        background: #1b1b1b;
        border-radius: 16px;
    }

    h1 {
        text-align: center;
        margin-bottom: 25px;
    }

    label {
        display: block;
        margin-top: 15px;
        margin-bottom: 6px;
    }

    input {
        width: 100%;
        padding: 12px;
        border: 0;
        border-radius: 8px;
        background: #292929;
        color: white;
        font-size: 16px;
        outline: none;
    }

    button {
        width: 100%;
        margin-top: 20px;
        padding: 13px;
        border: 0;
        border-radius: 8px;
        background: #5865f2;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #4752c4;
    }

    textarea {
        width: 100%;
        height: 220px;
        margin-top: 20px;
        padding: 12px;
        resize: vertical;
        border: 0;
        border-radius: 8px;
        background: #080808;
        color: #00ff88;
        font-family: monospace;
        font-size: 13px;
    }

    #status {
        margin-top: 15px;
        text-align: center;
        color: #aaa;
    }
</style>
</head>

<body>

<div class="container">

    <h1>JJS Mesh Converter</h1>

    <label>Mesh Texture ID</label>

    <input
        id="textureId"
        type="number"
        placeholder="Example: 2"
    >

    <label>Asset ID</label>

    <input
        id="assetId"
        type="number"
        placeholder="Example: 2"
    >

    <button id="generateButton">
        Generate JJS Code
    </button>

    <textarea
        id="base64Output"
        readonly
        placeholder="jjs code output will appear here..."
    ></textarea>

    <button id="copyButton">
        Copy
    </button>

    <div id="status">
        Ready
    </div>

</div>

<script type="module">

import {
    compress
} from "https://esm.sh/@cloudpss/zstd@0.3.23";


const textureInput =
    document.getElementById("textureId");

const assetInput =
    document.getElementById("assetId");

const output =
    document.getElementById("base64Output");

const status =
    document.getElementById("status");

const generateButton =
    document.getElementById("generateButton");

const copyButton =
    document.getElementById("copyButton");


/*
    Uint8Array → Base64
*/
function bytesToBase64(bytes) {

    let binary = "";

    const chunkSize = 0x8000;

    for (
        let i = 0;
        i < bytes.length;
        i += chunkSize
    ) {

        const chunk = bytes.subarray(
            i,
            Math.min(i + chunkSize, bytes.length)
        );

        binary += String.fromCharCode(...chunk);
    }

    return btoa(binary);
}


/*
    Generate JJS code
*/
generateButton.addEventListener("click", async () => {

    const texture =
        textureInput.value.trim();

    const asset =
        assetInput.value.trim();


    if (!texture || !asset) {

        alert(
            "Enter both the Mesh Texture ID and Asset ID."
        );

        return;
    }


    status.textContent =
        "Generating...";


    /*
        Create the JJS DATA object
    */
    const innerData = {

        Line: [

            {
                TEXTURE: Number(texture),

                AMOUNT: Number(asset),

                K_NAME: "VISUAL",

                EFFECT: "Mesh"
            }

        ],

        Prop: [],

        Req: []
    };


    /*
        Create complete JJS JSON
    */
    const jjsData = [

        {
            ADD: false,

            NAME: "IMPORT",

            K_NAME: "SKILL",

            KEY: 1,

            "TOOL TIP": "",

            DATA: JSON.stringify(innerData),

            COOLDOWN: 0
        }

    ];


    /*
        JSON is generated internally.
        It is NOT shown to the user.
    */
    const json =
        JSON.stringify(jjsData);


    try {

        status.textContent =
            "Compressing...";


        /*
            JSON → UTF-8
        */
        const encoder =
            new TextEncoder();

        const bytes =
            encoder.encode(json);


        /*
            UTF-8 → Zstandard
        */
        const compressed =
            await compress(bytes, 3);


        /*
            Zstandard → Base64
        */
        const base64 =
            bytesToBase64(compressed);


        /*
            Only show final output
        */
        output.value =
            base64;


        status.textContent =
            "Done!";


    } catch (error) {

        console.error(error);

        status.textContent =
            "Conversion failed.";

        alert(
            "Zstandard error:\n\n" +
            error.message
        );
    }

});


/*
    Copy final code
*/
copyButton.addEventListener("click", async () => {

    if (!output.value) {

        alert("Generate a JJS code first.");

        return;
    }


    await navigator.clipboard.writeText(
        output.value
    );


    status.textContent =
        "Copied!";
});

</script>

</body>
</html>
